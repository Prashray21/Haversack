<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="Diagram: project.yaml flows through Runtime into generated files; the check engine validates the repo">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .box { fill: #1e293b; stroke: #475569; rx: 8; }
    .title { font: 600 14px 'Segoe UI', sans-serif; fill: #e2e8f0; }
    .label { font: 12px 'Segoe UI', sans-serif; fill: #94a3b8; }
    .small { font: 11px 'Consolas', monospace; fill: #7dd3fc; }
    .flow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .head { font: 700 16px 'Segoe UI', sans-serif; fill: #f1f5f9; }
  </style>

  <text x="20" y="28" class="head">How Project Runtime works (diagram)</text>

  <!-- source of truth -->
  <rect x="20" y="60" width="230" height="110" rx="8" class="box"/>
  <text x="35" y="85" class="title">Source of truth (committed)</text>
  <text x="35" y="110" class="small">project.yaml  (spec v1)</text>
  <text x="35" y="130" class="small">context/*.md   rules/*.md</text>
  <text x="35" y="155" class="label">one definition for the whole team</text>

  <!-- engine -->
  <rect x="310" y="60" width="200" height="110" rx="8" class="box"/>
  <text x="325" y="85" class="title">Runtime engine</text>
  <text x="325" y="110" class="label">load + validate schema</text>
  <text x="325" y="130" class="label">secret gate (redacted)</text>
  <text x="325" y="150" class="label">definition hash</text>

  <!-- adapters -->
  <rect x="570" y="30" width="290" height="170" rx="8" class="box"/>
  <text x="585" y="55" class="title">Adapters (pure, versioned)</text>
  <text x="585" y="80" class="small">claude-code → CLAUDE.md</text>
  <text x="585" y="105" class="small">cursor → .cursor/rules/runtime.mdc</text>
  <text x="585" y="130" class="small">copilot → .github/copilot-instructions.md</text>
  <text x="585" y="160" class="label">generated files carry a DO-NOT-EDIT header;</text>
  <text x="585" y="180" class="label">writes are atomic (temp file + rename)</text>

  <!-- manifest -->
  <rect x="310" y="210" width="200" height="70" rx="8" class="box"/>
  <text x="325" y="235" class="title">.runtime/manifest.json</text>
  <text x="325" y="258" class="label">content hashes → drift states</text>

  <!-- drift states -->
  <rect x="570" y="230" width="290" height="100" rx="8" class="box"/>
  <text x="585" y="255" class="title">Drift detection</text>
  <text x="585" y="278" class="small">unchanged · new · stale</text>
  <text x="585" y="298" class="small">hand-edited · untracked</text>
  <text x="585" y="320" class="label">hand-edited files are never overwritten</text>

  <!-- check engine -->
  <rect x="20" y="330" width="840" height="110" rx="8" class="box"/>
  <text x="35" y="355" class="title">runtime check  (local; the future GitHub App reuses this engine)</text>
  <text x="35" y="380" class="small">static checks: pattern + path globs + severity (block/warn/info)</text>
  <text x="35" y="400" class="small">secret gate: redacted findings, runtime:allow-secret markers</text>
  <text x="35" y="420" class="small">llm-judged checks (--base diff mode): experimental, unverified live — skipped, never a silent pass</text>

  <!-- flows -->
  <path d="M 250 115 H 305" class="flow"/>
  <path d="M 510 100 H 565" class="flow"/>
  <path d="M 510 140 C 540 200, 480 235, 515 245" class="flow"/>
  <path d="M 410 170 V 205" class="flow"/>
  <path d="M 135 170 V 325" class="flow"/>
</svg>
