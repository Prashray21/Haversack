name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ESBUILD_VERSION: "0.28.2" # matches the version resolved in pnpm-lock.yaml
  SEA_FUSE: "NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest # arm64 native + x64 via the official darwin-x64 node build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      # Node SEA: bundle the CLI to one CommonJS file, bake it into a blob,
      # then inject the blob into a copy of the Node binary.
      - name: Bundle CLI (single CommonJS file)
        run: npx -y esbuild@${{ env.ESBUILD_VERSION }} packages/cli/dist/main.js --bundle --platform=node --format=cjs --outfile=build/sea-entry.cjs
      - name: Generate SEA blob
        run: node --experimental-sea-config scripts/sea/sea-config.json

      - name: Assemble runtime-linux-x64
        if: runner.os == 'Linux'
        run: |
          cp "$(which node)" build/runtime-linux-x64
          npx -y postject build/runtime-linux-x64 NODE_SEA_BLOB build/sea-prep.blob --sentinel-fuse ${{ env.SEA_FUSE }}

      # macOS: postject invalidates Apple's code signature; re-sign ad hoc so
      # the binary executes at all (Apple Silicon refuses unsigned Mach-O).
      # This is NOT Developer-ID/possibly-notarized distribution signing.
      - name: Assemble runtime-macos-arm64 (native)
        if: runner.os == 'macOS'
        run: |
          cp "$(which node)" build/runtime-macos-arm64
          npx -y postject build/runtime-macos-arm64 NODE_SEA_BLOB build/sea-prep.blob --sentinel-fuse ${{ env.SEA_FUSE }} --macho-segment-name NODE_SEA
          codesign --force --sign - build/runtime-macos-arm64

      - name: Assemble runtime-macos-x64 (via official darwin-x64 node)
        if: runner.os == 'macOS'
        run: |
          NODE_VERSION="$(node --version)"
          mkdir -p build/x64node
          curl -sSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-x64.tar.gz" | tar -xz -C build/x64node --strip-components=1
          cp build/x64node/bin/node build/runtime-macos-x64
          npx -y postject build/runtime-macos-x64 NODE_SEA_BLOB build/sea-prep.blob --sentinel-fuse ${{ env.SEA_FUSE }} --macho-segment-name NODE_SEA
          codesign --force --sign - build/runtime-macos-x64

      - name: Assemble runtime-windows-x64.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-Command node).Source build/runtime-windows-x64.exe
          # Node's PE signature is invalidated by injection; remove it first (per Node SEA docs).
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool remove /s build/runtime-windows-x64.exe
          npx -y postject build/runtime-windows-x64.exe NODE_SEA_BLOB build/sea-prep.blob --sentinel-fuse ${{ env.SEA_FUSE }}

      - name: Smoke test — sync --verify on the sample project
        shell: bash
        run: |
          cd examples/sample-project
          if [ "${{ runner.os }}" = "macOS" ]; then
            ../../build/runtime-macos-arm64 sync --verify
            ../../build/runtime-macos-x64 sync --verify   # Rosetta 2
          else
            ../../build/runtime-* sync --verify
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ runner.arch }}
          path: |
            build/runtime-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create --verify-tag shells out to git and needs a checkout.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum runtime-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG.md (M9)
        run: |
          TAG="${{ github.ref_name }}"
          # Section = from the heading mentioning the tag to the next heading.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG has no section for $TAG — falling back to generated notes"
            echo "" > release-notes.md
            echo "EMPTY_NOTES" >> "$GITHUB_ENV"
          fi
          cat release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA=""
          case "${{ github.ref_name }}" in
            # A hyphen = prerelease per semver (e.g. v0.1.0-alpha.1, v*-test).
            *-*) EXTRA="--prerelease" ;;
          esac
          if [ "${{ env.EMPTY_NOTES }}" = "EMPTY_NOTES" ]; then
            gh release create "${{ github.ref_name }}" dist/runtime-* dist/SHA256SUMS.txt --verify-tag --generate-notes --title "${{ github.ref_name }}" $EXTRA
          else
            gh release create "${{ github.ref_name }}" dist/runtime-* dist/SHA256SUMS.txt --verify-tag --notes-file release-notes.md --title "${{ github.ref_name }}" $EXTRA
          fi
