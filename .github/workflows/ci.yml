name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Build first: the CLI typechecks against @runtime/core's dist
      # declarations, which only exist after core builds.
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  # Dogfood (M2): the repo's own project.yaml must stay in sync and pass its
  # own checks — the product enforces itself on every push and PR.
  dogfood:
    name: dogfood (sync --verify + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: runtime sync --verify (this repo)
        run: node packages/cli/dist/main.js sync --verify
      - name: runtime check (this repo)
        run: node packages/cli/dist/main.js check

  # The standalone SEA binary must be able to run the repo's own checks too
  # (M3): same commands as the dogfood job, through the single executable.
  binary-smoke:
    name: SEA binary smoke (ubuntu)
    runs-on: ubuntu-latest
    env:
      ESBUILD_VERSION: "0.28.2"
      SEA_FUSE: "NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Assemble the binary (bundle + SEA blob + postject)
        run: |
          npx -y esbuild@${{ env.ESBUILD_VERSION }} packages/cli/dist/main.js --bundle --platform=node --format=cjs --outfile=build/sea-entry.cjs
          node --experimental-sea-config scripts/sea/sea-config.json
          cp "$(which node)" build/runtime-linux-x64
          npx -y postject build/runtime-linux-x64 NODE_SEA_BLOB build/sea-prep.blob --sentinel-fuse ${{ env.SEA_FUSE }}
      - name: runtime --version (binary)
        run: ./build/runtime-linux-x64 --version
      - name: runtime sync --verify (binary)
        run: ./build/runtime-linux-x64 sync --verify
      - name: runtime check (binary)
        run: ./build/runtime-linux-x64 check
